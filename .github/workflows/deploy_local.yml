name: CD - Local Deploy (Compose) + Smoke Test

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: read

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python (for smoke + dummy model creation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python deps (requests + torch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Create dummy model artifact (matches app/model.py architecture)
        run: |
          mkdir -p models
          python - <<'PY'
          import torch
          import torch.nn as nn
          from pathlib import Path

          # MUST match app/model.py exactly
          class SmallCNN(nn.Module):
              def __init__(self, num_classes: int = 2):
                  super().__init__()
                  self.features = nn.Sequential(
                      nn.Conv2d(3, 16, 3, padding=1),
                      nn.ReLU(inplace=True),
                      nn.MaxPool2d(2),

                      nn.Conv2d(16, 32, 3, padding=1),
                      nn.ReLU(inplace=True),
                      nn.MaxPool2d(2),

                      nn.Conv2d(32, 64, 3, padding=1),
                      nn.ReLU(inplace=True),
                      nn.AdaptiveAvgPool2d((1, 1)),
                  )
                  self.classifier = nn.Linear(64, num_classes)

              def forward(self, x):
                  x = self.features(x)
                  x = x.view(x.size(0), -1)
                  return self.classifier(x)

          payload = {
              "state_dict": SmallCNN(num_classes=2).state_dict(),
              "class_names": ["Cat", "Dog"],
              "img_size": 224,
              "architecture": "SmallCNN",
          }

          Path("models").mkdir(exist_ok=True)
          torch.save(payload, "models/cats_dogs_model.pt")
          print("✅ Created models/cats_dogs_model.pt")
          PY

      - name: Start service with docker compose (mount model folder)
        run: |
          export MODEL_DIR="${GITHUB_WORKSPACE}/models"
          echo "MODEL_DIR=$MODEL_DIR"
          cd deployment
          docker compose up -d
          docker compose ps

      - name: Verify model file exists inside container
        run: |
          cid=$(docker ps --filter "name=cats_dogs_api" -q | head -n 1)
          echo "Container ID: $cid"
          docker exec $cid ls -la /app/models
          docker exec $cid ls -la /app/models/cats_dogs_model.pt
          docker exec $cid python - <<'PY'
          import os
          print("MODEL_PATH env:", os.getenv("MODEL_PATH"))
          print("Exists /app/models/cats_dogs_model.pt:", os.path.exists("/app/models/cats_dogs_model.pt"))
          PY

      - name: Show API logs (startup)
        run: |
          cd deployment
          docker compose logs --no-color --tail=250 cats_dogs_api

      - name: Wait for health endpoint to become ready
        run: |
          python - <<'PY'
          import time, requests
          url = "http://localhost:8000/health"
          last = None
          for i in range(30):
              try:
                  r = requests.get(url, timeout=5)
                  last = (r.status_code, r.text)
                  if r.status_code == 200:
                      print("✅ Health:", r.json())
                      break
              except Exception as e:
                  last = ("EXC", str(e))
              time.sleep(2)
          else:
              raise SystemExit(f"❌ Service did not become healthy in time. Last={last}")
          PY

      - name: Run smoke test (health + predict)
        run: |
          BASE_URL=http://localhost:8000 \
          SMOKE_IMAGE=app/tests/assets/sample_cat.jpg \
          python deployment/smoke_test.py

      - name: Print metrics (optional evidence)
        run: |
          curl -s http://localhost:8000/metrics | head -n 30

      - name: Shutdown compose
        if: always()
        run: |
          cd deployment
          docker compose down